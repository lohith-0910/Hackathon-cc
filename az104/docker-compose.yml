version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: keyvault-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  eureka-server:
    build:
      context: ./backend
      dockerfile: eureka-server/Dockerfile
    container_name: keyvault-eureka-server
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=docker

  api-gateway:
    build:
      context: ./backend
      dockerfile: api-gateway/Dockerfile
    container_name: keyvault-api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - eureka-server
    environment:
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/

  auth-service:
    build:
      context: ./backend
      dockerfile: auth-service/Dockerfile
    container_name: keyvault-auth-service
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      - MYSQL_URL=jdbc:mysql://mysql:3306/keyvault_auth?createDatabaseIfNotExist=true&useSSL=false
      - MYSQL_USER=root
      - MYSQL_PASSWORD=rootpassword
      - MYSQL_DRIVER=com.mysql.cj.jdbc.Driver
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: keyvault-frontend
    ports:
      - "5173:5173"
    depends_on:
      - api-gateway

volumes:
  mysql_data:
